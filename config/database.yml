# PostgreSQL. Versions 9.5 and up are supported.
#
# Development uses DATABASE_URL. Test may use TEST_DATABASE_URL on any host.
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>
  gssencmode: disable

<% if ENV["DATABASE_URL"].present? %>
development:
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  prepared_statements: false
  gssencmode: disable
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
<% else %>
development:
  <<: *default
  database: pt_society_development
<% end %>

test:
  <<: *default
  database: pt_society_test
  url: <%= ENV["TEST_DATABASE_URL"].presence || "postgresql:///#{ENV.fetch('TEST_DATABASE_NAME', 'pt_society_test')}" %>

production:
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  prepared_statements: false
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
